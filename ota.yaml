version: 1

project:
  name: meta-change-reviewer-slice-1
  description: Prepared checkout PR with baseline checks, bounded Muse feedback, original/A/B controls and same-test red-green.

metadata:
  ota:
    minimum_version: "1.6.28"

execution:
  preferred: native
  supported:
    - native

toolchains:
  node:
    version: "=24.22.1"
    fulfillment:
      mode: none

env:
  vars:
    META_DEMO_APPROVAL_FILE:
      required: false
    META_DEMO_KEY_FILE:
      required: false
    META_DEMO_OTA_EXECUTABLE:
      required: false
    META_DEMO_SESSION_MINUTES:
      required: false
    META_DEMO_REQUEST_LIMIT:
      required: false
    OTA_DEMO_TEST_OTA:
      required: false
    OTA_DEMO_TEST_OTA_SHA256:
      required: false
    OTA_DEMO_TEST_CHECKPOINT:
      required: false
    OTA_DEMO_TEST_CHECKPOINT_SHA256:
      required: false

surfaces:
  pricing:
    kind: http
    label: Local pricing-regression reproducer
    purpose: Review proposed expectations before executing the fixed pricing comparison.
    visibility: internal
    port: 48761
    path: /
    readiness:
      kind: http
      method: GET
      path: /health
      success:
        status: [200]
      interval: 1s
      timeout: 2s
      retries: 5

tasks:
  "verify:shallow":
    description: Run the original all-eligible smoke checks.
    requirements:
      toolchains: [node]
    command:
      exe: node
      args:
        - checks/shallow.ts

  "verify:semantic":
    description: Run the frozen accepted semantic checker against the current source.
    requirements:
      toolchains: [node]
    notes: |
      Historical seeded BAD source intentionally fails this task. It is not the
      live pricing MVP's verification entrypoint; never weaken the checker.
    command:
      exe: node
      args:
        - checks/semantic.ts

  "verify:report":
    description: Test the static evidence renderer using isolated fixture-owned evidence paths.
    requirements:
      toolchains: [node]
    command:
      exe: node
      args:
        - --test
        - checks/report.test.mjs
    effects:
      writes:
        - evidence/

  "report:render":
    description: Render only evidence/review.json to the static evidence/report.html card.
    requirements:
      toolchains: [node]
    command:
      exe: node
      args:
        - tools/report.mjs
    effects:
      writes:
        - evidence/

  "verify:pricing":
    description: Check the written pricing rule and prepared original/change controls offline.
    requirements:
      toolchains: [node]
    command:
      exe: node
      args: [--test, checks/pricing.test.mjs]
    effects:
      network: false
    notes: |
      Deterministic authored controls, not model-generated or customer evidence.
      The independent written rule is the oracle, never baseline behaviour alone.

  "verify:baseline":
    description: Run the same three ordinary basket assertions against original and proposed checkout code.
    requirements:
      toolchains: [node]
    command:
      exe: node
      args: [--max-old-space-size=128, --test, --test-reporter=tap, checks/baseline.test.mjs]
    effects:
      network: false
    notes: |
      Six actual assertions, three baskets times two versions. This honest limited
      baseline has no voucher-boundary coverage; it is not the witness fixture suite.

  "verify:web":
    description: Check UI validation and flow using injected mock fetch only.
    requirements:
      toolchains: [node]
    command:
      exe: node
      args: [--test, checks/web-flow.test.mjs]
    effects:
      network: false
    notes: |
      No listener, browser, provider request, credential, or DOM screenshot proof.

  "verify:live":
    description: Check controller, feedback binding, retained checkpoint, durable budget and export persistence offline.
    only_on: [macos]
    requirements:
      toolchains: [node]
    command:
      exe: node
      args: [--test, checks/live-demo.test.mjs]
    effects:
      writes: [evidence/live-tests/]
      network: false
    notes: |
      Synthetic providers/runners/reviewer declarations only. Tests own and remove
      unique temporary directories; they do not initialize the operational budget.

  "verify:live-mvp":
    description: Run the finite offline pricing, UI and controller checks.
    only_on: [macos]
    aggregate:
      tasks: [verify:pricing, verify:baseline, verify:web, verify:live, verify:delivery]
    notes: |
      Not a live API, browser, exported-test, CI, release or production qualification.

  "verify:delivery":
    description: Prove fixed disposable-copy baseline and same-test red-green execution offline.
    only_on: [macos]
    requirements:
      toolchains: [node]
      env: [OTA_DEMO_TEST_OTA, OTA_DEMO_TEST_OTA_SHA256]
    command:
      exe: node
      args: [--test, checks/delivery.test.mjs]
    effects:
      writes: [evidence/delivery-tests/]
      network: false
    notes: |
      Requires an already-qualified released Ota executable and its SHA-256.
      Calls real declared tasks in owned copies; no provider, key, approval or ledger.
      Authored integration fixtures, not fresh model evidence or an OS sandbox.

  "verify:export":
    description: Run the exact persisted regression test against the selected prepared change.
    requirements:
      toolchains: [node]
    command:
      exe: node
      args: [--max-old-space-size=128, --test, --test-reporter=tap, evidence/regression.test.mjs]
    effects:
      network: false
    notes: |
      The app stages a frozen session-local export at this fixed path inside
      its owned verification copies. The archive alone is not a standalone checkout.
      Requires an actual persisted export. A reproduced candidate regression
      intentionally produces a failing assertion; missing export is not a pass.
      Recheck the export hash before running. No model-produced executable code.

  "demo:live:budget":
    description: Prepare a fresh bounded local session with automatic source/binary pins; no service or model request.
    only_on: [macos]
    requirements:
      toolchains: [node]
      env: [META_DEMO_APPROVAL_FILE, META_DEMO_KEY_FILE, META_DEMO_OTA_EXECUTABLE, META_DEMO_SESSION_MINUTES, META_DEMO_REQUEST_LIMIT]
    command:
      exe: node
      args: [tools/live-demo.mjs, --initialize-budget]
    effects:
      writes: [evidence/live/]
      network: false
    notes: |
      Explicit session preparation, never an automatic server dependency. Choose
      a new evidence/live/<session>/approval.json path, 1-60 minutes and 1-6 requests.
      The key is an existing owner-private file outside the checkout; preparation
      checks metadata only. Source and qualified Node/Ota binary hashes are recorded
      automatically. Private directories, approval and budget are created exclusively;
      existing/legacy/partial state is never reset, repaired or silently adopted.
      This task starts no listener and dispatches no provider request.

  "demo:live":
    description: Start the reviewed loopback-only pricing reproducer for one approved window.
    only_on: [macos]
    requirements:
      toolchains: [node]
      env: [META_DEMO_APPROVAL_FILE]
    launch:
      kind: command
      exe: node
      args: [tools/live-demo.mjs]
    runtime:
      kind: service
      surfaces:
        pricing:
          bind:
            address: 127.0.0.1
            port:
              mode: fixed
              value: 48761
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 48761
              path: /
              primary: true
    effects:
      writes: [evidence/live/]
      network: true
      network_kind: integration_test
    notes: |
      Task admission is not live-use approval. Independent frozen-source review
      and exact operational clearance are required before starting this service.
      The V2 private approval binds sources, Node/Ota binaries, external key path,
      issued time, bounded deadline and explicit request cap. Normal startup requires
      the already-prepared matching ledger, never creates or renews one, and performs
      zero provider requests. Durable reservations precede dispatch; failures count.
      No retry/fallback, top-up, arbitrary code, repair application or deployment.
      Reviewer declarations are not identity attestation. Prepared audited code
      runs in a bounded child without the provider credential, not an OS sandbox.
      The controller persists the export and evidence; browser downloads are copies.
      Actual baseline and same-test red-green checks use pinned released Ota in
      private source copies; only the prepared reviewed implementation changes.
      The correction is not generated by Muse. Copies contain no key/approval/ledger.
      The session ledger retains prior consumption; this task never renews it.
      One outcome-informed feedback attempt per root proposal requires fresh
      baseline/B control, an exclusive durable marker and the same budget.
      Fresh sessions do not import old approvals, exhausted ledgers or historical
      retained checkpoints. Historical evidence remains unchanged and separate.
      Ota declares execution/effects, not comprehensive network or process containment.

  "demo:excluded":
    description: Harmless marker-writing task excluded from agent admission.
    command:
      exe: node
      args:
        - --input-type=commonjs
        - -e
        - >-
          const fs = require("node:fs");
          fs.mkdirSync(".demo-scratch", { recursive: true });
          fs.writeFileSync(".demo-scratch/excluded.marker", "excluded demo task\n");
    effects:
      writes:
        - .demo-scratch/

agent:
  entrypoint: verify:live-mvp
  default_task: verify:live-mvp
  notes: |
    Read README.md for the current workflow. Historical records are evidence,
    not current execution authority. This is a prepared
    checkout demo, not a customer PR or production payment assurance.
    Use declared ota run <task> --agent paths and the qualified prerequisites
    in README.md. The full offline aggregate needs the qualified Ota executable
    path and its verified SHA-256; fixture passes are not fresh model evidence.
    Preserve the written pricing rule, reviewed expectations, original/A/B
    controls and identical regression-test bytes. Never weaken a checker or
    turn an intentional faulty-code failure into a claimed pass.
    Model proposals are data, not executable code. Review expected totals
    against the rule before comparison. The correction is pre-reviewed, not
    generated live by Muse; the recorded feedback chose STOP with no new cases.
    Retained initial evidence is historical; live follow-up-case execution was
    not demonstrated. Do not promote selected-case results to whole-PR approval.
    The earlier recording window is closed and its six requests remain consumed.
    A fresh session requires explicit owner inputs and a new private scope;
    never renew, import or reset historical approval/budget files. Agent-safe task
    admission alone is not consent for provider use, installs, deployment or submission.
    Keep credentials, approvals, ledgers and private evidence out of source.
    Do not invoke Copilot. Bobai will record his own video; do not restore the
    withdrawn generated video, watch page or old Git refs.
    Contract edits change its identity. Preserve old evidence and source pins;
    never relabel a past run or reuse its private approval for changed sources.
  safe_tasks:
    - verify:shallow
    - verify:semantic
    - verify:report
    - report:render
    - verify:pricing
    - verify:baseline
    - verify:web
    - verify:live
    - verify:live-mvp
    - verify:delivery
    - verify:export
    - demo:live:budget
    - demo:live
  verify_after_changes:
    - verify:live-mvp
  writable_paths:
    - src/
    - evidence/
  protected_paths:
    - ota.yaml
    - checks/
    - fixtures/
    - tools/report.mjs
    - tools/live-demo.mjs
    - tools/pricing-runner.mjs
    - pricing/
    - web/
